# Candidate for .github/workflows/ci.yml in the standalone locale repository.
# No deployment, credentials persistence, paid runner, cache or artifact upload.
name: Locale exact-revision checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # This bounded workflow is approved for standard public-repository runners only.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Testing exact revision %s\n' "$EXPECTED_SHA"
      - name: Set disposable browser storage on the allocated runner
        timeout-minutes: 1
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/playwright-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up pinned Node without a dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Check the committed static bundle with only Node on PATH
        timeout-minutes: 2
        run: |
          node --version
          node_only="$RUNNER_TEMP/node-only-bin"
          mkdir -p "$node_only"
          ln -s "$(command -v node)" "$node_only/node"
          # No Cargo, npm, Python, browser, dependency installation or network in this gate.
          PATH="$node_only" "$node_only/node" scripts/verify-build.mjs
          sha256sum web/locale_review.wasm > "$RUNNER_TEMP/committed-wasm.sha256"
      - name: Check JavaScript syntax
        timeout-minutes: 2
        run: |
          node --check web/app.js
          node --check web/files.js
          node --check web/image-pipeline.js
          node --check web/image-worker.js
      - name: Install the pinned Rust toolchain and WASM target
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: Fetch the locked dependency graph before offline Rust checks
        timeout-minutes: 3
        run: |
          cargo fetch --locked
          printf 'CARGO_NET_OFFLINE=true\n' >> "$GITHUB_ENV"
      - name: Check Rust formatting, strict Clippy and native tests
        timeout-minutes: 5
        run: |
          cargo fmt --all -- --check
          cargo clippy --offline --locked --all-targets -- -D warnings
          cargo test --offline --locked --all-targets
      - name: Rebuild WASM and bind it to the committed static artifact
        timeout-minutes: 5
        run: |
          bash scripts/build.sh
          # A mismatch is a failed source/artifact binding, never a reason to auto-commit.
          sha256sum --check "$RUNNER_TEMP/committed-wasm.sha256"
      - name: Run actual WASM and source regression suites
        timeout-minutes: 3
        run: |
          mkdir -p evidence
          node scripts/wasm-tests.mjs
          node scripts/capacity-tests.mjs
          node scripts/image-pipeline-tests.mjs
          node scripts/image-format-tests.mjs
          node scripts/accessibility-static-tests.mjs
      - name: Install the locked Python browser tools and their Chromium
        timeout-minutes: 6
        run: |
          # Ubuntu 24.04 supplies Python 3.12. Fail clearly if that interpreter is absent.
          python3.12 --version
          python3.12 -m venv "$RUNNER_TEMP/locale-browser-venv"
          "$RUNNER_TEMP/locale-browser-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r requirements-browser.lock
          "$RUNNER_TEMP/locale-browser-venv/bin/python" -m pip check
          "$RUNNER_TEMP/locale-browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Run the real Chromium browser suite
        timeout-minutes: 5
        run: |
          # This script owns a temporary loopback server; no public preview is used.
          # Screenshots/reports remain local to the disposable runner and are not uploaded.
          mkdir -p evidence
          "$RUNNER_TEMP/locale-browser-venv/bin/python" scripts/browser-tests.py
